[application]
name = "git-tree"
default_platform = "desktop"
out_dir = "dist"
asset_dir = "public"

[web.app]
title = "git-tree"

[desktop.app]
filename = "git-tree"

# Used by `dx bundle` — Android needs a reverse-DNS package id.
[bundle]
identifier = "io.github.mahirojv.gittree"
publisher = "MahiroJV"
icon = ["assets/icon/png/icon.png"]
short_description = "A terminal-style git branch visualizer"
