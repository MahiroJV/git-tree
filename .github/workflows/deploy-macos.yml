name: Deploy — macOS

on:
  push:
    tags:
      - "v*"

env:
  BINARY_NAME: git-tree

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build-macos.yml

  # ── 3. Package — tar.gz ──────────────────────────────────────────────────
  package:
    name: Package macOS
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - name: Rename binary and tar it up
        run: |
          VERSION="${{ github.ref_name }}"
          mv dist/${{ env.BINARY_NAME }} dist/${{ env.BINARY_NAME }}-macos-arm64
          chmod +x dist/${{ env.BINARY_NAME }}-macos-arm64
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          cd dist
          tar czf ${{ env.BINARY_NAME }}-${VERSION}-macos-arm64.tar.gz ${{ env.BINARY_NAME }}-macos-arm64

      - name: Compute SHA256
        run: |
          cd dist
          shasum -a 256 ${{ env.BINARY_NAME }}-macos-arm64 \
                        ${{ env.BINARY_NAME }}-${{ env.VERSION }}-macos-arm64.tar.gz \
            > SHA256SUMS-macos.txt

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packaged-${{ github.ref_name }}
          path: dist/
          retention-days: 7

  # ── 4. GitHub Release ──────────────────────────────────────────────────────
  release:
    name: GitHub Release (macOS)
    needs: [build, package]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-packaged-${{ github.ref_name }}
          path: dist/

      - name: Build release notes
        run: |
          VERSION=${{ github.ref_name }}
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[?${VERSION#v}\]?/{found=1; next} found && /^## /{exit} found{print}" \
              CHANGELOG.md > release_notes.txt
          fi
          if [ ! -s release_notes.txt ]; then
            cat > release_notes.txt << 'EOF'
          ## macOS Installation

          ```bash
          tar xzf git-tree-*-macos-arm64.tar.gz
          chmod +x git-tree-macos-arm64
          ./git-tree-macos-arm64
          ```

          App is unsigned. Gatekeeper block it first run.
          Fix: right-click binary → Open, click Open on warning.

          **Note:** Apple Silicon (arm64) build only. Intel Mac not supported yet.
          EOF
          fi

      # softprops/action-gh-release UPDATE existing release if Linux/Windows
      # job already made one for same tag — add mac assets too.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "git-tree ${{ github.ref_name }}"
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/${{ env.BINARY_NAME }}-macos-arm64
            dist/${{ env.BINARY_NAME }}-${{ github.ref_name }}-macos-arm64.tar.gz
            dist/SHA256SUMS-macos.txt