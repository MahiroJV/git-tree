[package]
name = "git-tree-viz"
version = "1.3.3"
edition = "2021"
authors = ["MahiroJV"]
description = "A terminal-style git branch visualizer"
license = "MIT"
repository = "https://github.com/MahiroJV/git-tree"
#homepage = "https://github.com/MahiroJV/git-tree"
keywords = ["git", "visualizer", "terminal", "dioxus", "tui"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = ["assets/fonts/*.ttf", ".idea/", "vendor/"]

[dependencies]
dioxus = { version = "0.6" }
# Native file dialogs — desktop only (no Android backend).
rfd = { version = "0.17.2", optional = true }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
tokio = { version = "1.52.0", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
# Window icon decoding — desktop only.
image = { version = "0.25.10", optional = true }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
urlencoding = "2"
openssl = { version = "0.10", features = ["vendored"] }
webbrowser = "0.8"

# ashpd 0.8.1 (via dioxus-desktop → rfd 0.14) fails on Rust ≥ 1.100; see
# vendor/README.md. Drop this when moving to Dioxus 0.7+.
[patch.crates-io]
ashpd = { path = "vendor/ashpd" }

[features]
default = ["desktop"]
# Linux / Windows / macOS app (webview window + native file dialogs).
desktop = ["dioxus/desktop", "dep:rfd", "dep:image"]
# Android (and later iOS): `dx bundle --platform android`.
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[[bin]]
name = "git-tree"
path = "src/main.rs"
